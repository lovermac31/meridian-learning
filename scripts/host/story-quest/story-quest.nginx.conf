# story-quest.jurassicenglish.com — static Story Quest served from Jay's server.
# Mirrors the headers in Story Quest's own vercel.json. No X-Robots-Tag: this is a
# public production surface, unlike the staging site on the same host.
# certbot --nginx adds the 443 server and the HTTP->HTTPS redirect after DNS exists.
server {
    listen 80;
    listen [::]:80;
    server_name story-quest.jurassicenglish.com;

    root /srv/story-quest/current;
    index index.html;
    charset utf-8;
    charset_types text/css application/javascript;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;

    # Hashed bundles and images: a missing file is a real 404, not the app shell.
    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
