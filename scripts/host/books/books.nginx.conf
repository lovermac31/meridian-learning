# books.jurassicenglish.com: the storybooks reader on Jay's server (replaces Vercel project je-storybooks-preview).
# Static files come from /srv/books/current/public; only /api/book goes to the Node API on 127.0.0.1:3110.
# Headers copy the live Vercel site, including its X-Robots-Tag noindex (the live site is noindex today).
# The private story files (api/_content) are outside the web root, so nginx cannot serve them.
# certbot --nginx adds the 443 server and the HTTP->HTTPS redirect once DNS points here.
server {
    listen 80;
    listen [::]:80;
    server_name books.jurassicenglish.com;

    root /srv/books/current/public;
    index index.html;
    charset utf-8;
    charset_types text/css application/javascript application/json application/manifest+json;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;

    location = /sw.js {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header Cache-Control "no-cache" always;
        add_header Service-Worker-Allowed "/" always;
    }
    location ~ ^/(precache-manifest\.json|auth-config\.js)$ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header Cache-Control "no-cache" always;
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        types { }
    }

    location ~ ^/api/book(\.js)?$ {
        proxy_pass http://127.0.0.1:3110;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header Cache-Control "private, no-store" always;
    }
    location /api/ { return 404; }

    # Like Vercel with cleanUrls off: exact files, a folder's index.html, else a plain-text 404 (no directory listings).
    location / {
        try_files $uri $uri/index.html =404;
    }
    error_page 404 = @notfound;
    location @notfound {
        default_type text/plain;
        return 404 "The page could not be found\n";
    }
}
